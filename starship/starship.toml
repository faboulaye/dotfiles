# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'nord'

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$nodejs\
$package\
$aws\
$docker_context\
$terraform\
$kubernetes\
$helm\
$jobs\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = '[➜](bold green)'

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'

[fill]
symbol = ' '

[python]
style = 'teal'
symbol = '🐍 '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[nodejs]
style = 'blue'
symbol = ' '

[package]
symbol = '📦 '

[aws]
symbol = '☁️ '
style = 'yellow'
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'

[terraform]
format = '[🏎 💨 $workspace]($style) '

[kubernetes]
disabled = false
symbol = '☸️ '

[helm]
format = 'via [⎈ $version](bold white) '
detect_files = ['Chart.yaml']

[docker_context]
symbol = '🐳 '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']

[jobs]
symbol = '+ '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white = '#D8DEE9'
